# Trang chu qkenn.cloud (tinh) — site Astro, repo qkenn04/qkenn-site
# Deploy: GitHub Actions → SSH forced command /usr/local/bin/qkenn-site-receive (xem deploy/README.md trong repo site)
#   /var/www/qkenn.cloud/releases/<id>/        mỗi bản build một thư mục
#   /var/www/qkenn.cloud/current  -> releases/  bản đang phục vụ (đổi NGUYÊN TỬ, không cần reload nginx)
#   /var/www/qkenn.cloud/previous -> releases/  bản ngay trước — chỉ dùng làm dự phòng cho /_astro/*
# KHÔNG bật open_file_cache cho vhost này: nó sẽ giữ đường dẫn của bản cũ sau khi đổi symlink.
server {
    listen 443 ssl;
    server_name qkenn.cloud www.qkenn.cloud;
    ssl_certificate     /etc/ssl/qkenn/cert.pem;
    ssl_certificate_key /etc/ssl/qkenn/key.pem;


    # Allowlist Cloudflare KẾ THỪA từ conf.d/00-cloudflare-only.conf (tầng http).
    # Muốn mở công khai: khai `allow all;` trong server block này.

    root /var/www/qkenn.cloud/current;
    index index.html;

    # Redirect /x → /x/ dùng Location tương đối ("/x/"), không bao giờ ra http:// hay host/cổng
    # origin khi đứng sau Cloudflare.
    absolute_redirect off;

    # nginx.conf đã `gzip on;` nhưng chỉ nén text/html → bổ sung CSS/JS/SVG/XML/JSON
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/json
        application/xml
        application/rss+xml
        image/svg+xml;

    error_page 404 /404.html;
    # Thư mục không có index.html (vd /en/blog/category/) → trang 404 của site thay vì 403 trần.
    # Client bị allowlist chặn vẫn nhận 403 trần (lần chuyển nội bộ tới /404.html cũng bị chặn).
    error_page 403 =404 /404.html;

    # Asset Astro có hash nội dung trong tên → cache vĩnh viễn (trình duyệt + Cloudflare).
    # Không có ở bản hiện tại (trang HTML cũ còn mở ngay lúc vừa deploy) → lấy từ bản trước.
    location /_astro/ {
        try_files $uri @astro_previous;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location @astro_previous {
        root /var/www/qkenn.cloud/previous;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # HTML và mọi file khác: luôn hỏi lại origin (ETag/Last-Modified → 304) để bản mới hiện ngay.
    # `always` để cả trang 404 (và 301) cũng không bị cache.
    # Astro build.format 'directory', URL chuẩn có dấu '/' (/gioi-thieu/, /en/about/, /blog/<slug>/):
    # /x là thư mục → nginx 301 sang /x/ (Location TƯƠNG ĐỐI nhờ absolute_redirect off).
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache" always;
    }
}
